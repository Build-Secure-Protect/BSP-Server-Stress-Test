modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# Server only: players join without it, and a client that has it is not asked to match the server's version.
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: with BSP-Core the mod can clear what bots left in its records and warn when it points at a database.
[[dependencies.${mod_id}]]
    modId="bsp_core"
    mandatory=false
    versionRange="${bsp_core_version_range}"
    ordering="NONE"
    side="SERVER"
